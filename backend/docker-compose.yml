version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: specz_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DEBUG=True
      - DATABASE_URL=postgresql+asyncpg://specz_user:specz_password@db:5432/specz_db
      - SYNC_DATABASE_URL=postgresql://specz_user:specz_password@db:5432/specz_db
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=dev_jwt_secret_key_specz_co_v2_32_bytes_long
      - REFRESH_TOKEN_SECRET=dev_refresh_secret_key_specz_co_v2_32_bytes
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-rzp_test_placeholder}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-placeholder_secret}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET:-placeholder_wh_secret}
      - AI_API_KEY=${AI_API_KEY:-placeholder_ai_key}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  db:
    image: postgres:15-alpine
    container_name: specz_db
    restart: always
    environment:
      POSTGRES_USER: specz_user
      POSTGRES_PASSWORD: specz_password
      POSTGRES_DB: specz_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U specz_user -d specz_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: specz_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data:
