name: Build Android Release APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Specz.co Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter Version
        run: flutter --version

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Prepare APK Output
        run: |
          mkdir -p build/dist
          cp build/app/outputs/flutter-apk/app-release.apk build/dist/Specz-v1.0.0-rc1-release.apk

      - name: Upload Downloadable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Specz-Android-Release-APK
          path: build/dist/Specz-v1.0.0-rc1-release.apk
          retention-days: 30

      - name: Create GitHub Release (on Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/dist/Specz-v1.0.0-rc1-release.apk
          name: Specz.co ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          make_latest: true
          body: |
            ## Specz.co Release Candidate
            - **Downloadable Android APK**: `Specz-v1.0.0-rc1-release.apk`
            - Built with Flutter & Java 17
            - Multi-profile eye care companion, OCR prescription extraction, persistent eye-drop alarms, and deterministic Vision Care Score.
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
